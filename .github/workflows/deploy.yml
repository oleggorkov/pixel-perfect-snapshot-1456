name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Устанавливаем Bun вместо Node.js
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 2. Устанавливаем зависимости через Bun
      - name: Install dependencies
        run: bun install

      # 3. Собираем проект через Bun
      - name: Build
        run: bun run build # или npm run build

      # 👇 Добавляем исправление для SPA (чтобы не было 404 при обновлении)
      - name: Fix SPA routing and bypass Jekyll
        run: |
          cd ./.output/public
          cp index.html 404.html
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ ИЗМЕНЕНО: Указываем правильную папку, где лежит index.html
          path: './.output/public' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
